<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Sticker Tribe</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="logo">
            <img src="logo.png" alt="Sticker Tribe Logo" style="height: 50px;"> STICKER TRIBE ADMIN
        </div>
        <a href="index.html" class="btn" style="text-decoration: none;">Back to Store</a>
    </header>

    <!-- Login Section -->
    <div id="login-section" class="admin-login">
        <h2>Secure Login</h2>
        <p style="margin-bottom: 15px; font-size: 0.9rem;">(Demo Mode: Use admin@dheeraj.com / G1wp23@sticker)</p>
        <div class="form-group">
            <label for="admin-email">Email:</label>
            <input type="email" id="admin-email" placeholder="admin@example.com">
        </div>
        <div class="form-group">
            <label for="admin-password">Password:</label>
            <input type="password" id="admin-password" placeholder="••••••••" style="width: 100%; padding: 15px; font-family: 'Space Mono', monospace; border: var(--border-width) solid var(--text-color); box-shadow: 4px 4px 0px 0px var(--accent-color); outline: none; background: var(--bg-color);">
        </div>
        <button class="btn btn-black" id="login-btn" style="width: 100%; margin-top: 10px;">Login</button>
        <p id="login-error" style="color: red; margin-top: 10px; font-weight: bold;"></p>
    </div>

    <!-- Dashboard Container (Injected via JS only after secure login) -->
    <div id="dashboard-container"></div>

    <div id="toast" class="toast">Action successful!</div>

    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/admin.js"></script>
</body>
</html>
